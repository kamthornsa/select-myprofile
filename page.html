<!doctype html>
<html lang="th">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>โปรไฟล์ของฉัน</title>
	<style>
		body { font-family: Arial, sans-serif; max-width: 520px; margin: 60px auto; padding: 24px; text-align: center; }
		.card { padding: 24px; border: 1px solid #ddd; border-radius: 12px; box-shadow: 0 4px 12px #0001; }
		button { padding: 10px 18px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
		button:hover { background: #1d4ed8; }
	</style>
</head>
<body>
	<main class="card">
		<h1>สวัสดี 👋</h1>
		<p id="message">ยินดีต้อนรับสู่โปรไฟล์ของฉัน</p>
		<button onclick="showMessage()">คลิกที่นี่</button>
	</main>

	<script>
		function showMessage() {
			document.getElementById('message').textContent = 'ขอบคุณที่เข้าชม!';
		}
	</script>
</body>
</html>
